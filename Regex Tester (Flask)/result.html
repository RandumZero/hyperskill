<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result</title>
</head>
<body>
    <p>Regex: {{ item.regex }}</p>
    <p>Text: {{ item.text }}</p>
    {% if item.result  %}
        <p>True</p>
    {% else %}
        <p>False</p>
    {% endif %}
</body>
</html>
